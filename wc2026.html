function getUTC(m) {
  const d = new Date(`${m.date}T00:00:00Z`);
  d.setUTCHours(m.etH + 4, m.etM, 0, 0);
  return d;
}

function toLocal(utc, offset) {
  return new Date(utc.getTime() + offset * 3600000);
}

function fmtTime(d) {
  const h = d.getUTCHours(), mn = d.getUTCMinutes();
  const ap = h >= 12 ? 'PM' : 'AM';
  return `${h%12||12}:${mn.toString().padStart(2,'0')} ${ap}`;
}

function fmtDate(d) {
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[d.getUTCDay()]} ${d.getUTCDate()} ${months[d.getUTCMonth()]}`;
}

function gcalUrl(m) {
  const start = getUTC(m);
  const end = new Date(start.getTime() + 7200000);
  const fmt = d => d.toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
  const title = encodeURIComponent(`⚽ WC2026: ${m.teams}`);
  const loc = encodeURIComponent(m.venue);
  const det = encodeURIComponent(`FIFA World Cup 2026 — ${m.stage}${m.group?' Group '+m.group:''}${m.match?' Match '+m.match:''}`);
  return `https://calendar.google.com/calendar/r/eventedit?text=${title}&dates=${fmt(start)}/${fmt(end)}&location=${loc}&details=${det}&reminder=60`;
}

function icsBlob(matches) {
  const fmt = d => d.toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0',
    'PRODID:-//FIFA World Cup 2026//EN',
    'CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'X-WR-CALNAME:FIFA World Cup 2026',
  ];
  matches.forEach((m,i) => {
    const s = getUTC(m);
    const e = new Date(s.getTime()+7200000);
    lines.push(
      'BEGIN:VEVENT',
      `UID:wc2026-${i}@calendar`,
      `DTSTART:${fmt(s)}`,`DTEND:${fmt(e)}`,
      `SUMMARY:⚽ WC2026: ${m.teams}`,
      `LOCATION:${m.venue}`,
      `DESCRIPTION:${m.stage}${m.group?' Group '+m.group:''}`,
      'BEGIN:VALARM','ACTION:DISPLAY',
      'DESCRIPTION:Kicks off in 1 hour',
      'TRIGGER:-PT60M','END:VALARM',
      'END:VEVENT'
    );
  });
  lines.push('END:VCALENDAR');
  return new Blob([lines.join('\r\n')],{type:'text/calendar'});
}

function App() {

  const [stage, setStage] = useState('All');

  const filtered = useMemo(() =>
    stage === 'All' ? MATCHES : MATCHES.filter(m => m.stage === stage),
    [stage]
  );

  const grouped = useMemo(() => {
    const map = {};
    filtered.forEach(m => {
      const utc = getUTC(m);
      const local = toLocal(utc, tz);
      const key = fmtDate(local);
      if (!map[key]) map[key] = [];
      map[key].push({...m, utc, local});
    });
    return Object.entries(map);
  }, [filtered, tz]);

  function download() {
    const blob = icsBlob(MATCHES);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'FIFA_World_Cup_2026.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

        <select value={tz} onChange={e=>setTz(parseFloat(e.target.value))}
          style={{background:'#1e2d3d',color:'#f1f5f9',border:'1px solid #334155',borderRadius:6,padding:'6px 10px',fontSize:14,flex:1,minWidth:0}}>
          {TIMEZONES.map(t=>(
            <option key={t.label} value={t.offset}>{t.label}</option>
          ))}

            color: stage===s ? '#000' : '#94a3b8',

            fontSize:12,fontWeight:600,whiteSpace:'nowrap',cursor:'pointer',flexShrink:0
          }}>{s}</button>
        ))}
      </div>

      <div style={{padding:'12px 16px'}}>
        <button onClick={download} style={{
          width:'100%',background:'#0f5132',color:'#f0b429',border:'1px solid rgba(240,180,41,0.3)',
          borderRadius:8,padding:'12px',fontSize:15,fontWeight:700,cursor:'pointer',letterSpacing:0.5
        }}>

                      {m.teams}
                    </div>
                    <div style={{fontSize:12,color:'#64748b',display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
                      <span style={{color:'#94a3b8',fontWeight:600}}>{fmtTime(m.local)}</span>
                      <span>·</span>
                      <span>{m.venue}</span>
                      {m.group && <span style={{background:'rgba(240,180,41,0.1)',color:'#f0b429',padding:'1px 6px',borderRadius:4,fontSize:11,fontWeight:700}}>Grp {m.group}</span>}
                      {m.match && !m.group && <span style={{background:'rgba(255,255,255,0.06)',color:'#94a3b8',padding:'1px 6px',borderRadius:4,fontSize:11}}>M{m.match}</span>}
                    </div>
                  </div>
                  <a href={gcalUrl(m)} target="_blank" rel="noopener noreferrer"
                    style={{background:'#1e3a5f',color:'#60a5fa',border:'1px solid #2563eb',borderRadius:7,padding:'8px 12px',fontSize:13,fontWeight:600,textDecoration:'none',flexShrink:0,whiteSpace:'nowrap'}}>
                    + GCal
                  </a>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
