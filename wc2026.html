.info { flex: 1; min-width: 0; }
.teams { font-size: 15px; font-weight: 600; color: #f1f5f9; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { font-size: 12px; color: #64748b; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.meta .time { color: #94a3b8; font-weight: 600; }
.badge-g { background: rgba(240,180,41,0.1); color: #f0b429; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; }

var STAGES = ['All','Group Stage','Round of 32','Round of 16','Quarter-final','Semi-final','Final'];
var STAGE_COLOR = {
  'Group Stage':'#22c55e','Round of 32':'#3b82f6','Round of 16':'#a855f7',
  'Quarter-final':'#f97316','Semi-final':'#ef4444','Final':'#f0b429'
};

var LS_KEY = 'wc2026_tz';

// Try to detect browser timezone, fall back to UTC+10
function detectDefaultTz() {
  try {
    var bTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    for (var i = 0; i < TIMEZONES.length; i++) {
      if (TIMEZONES[i].iana === bTz) return TIMEZONES[i].iana;
    }
  } catch(e) {}
  return 'Australia/Brisbane';
}

function loadSavedTz() {
  try { return localStorage.getItem(LS_KEY) || null; } catch(e) { return null; }
}
function saveTz(iana) {
  try { localStorage.setItem(LS_KEY, iana); } catch(e) {}
}

var state = {
  tzIana: loadSavedTz() || detectDefaultTz(),
  stage: 'All'
};

function getTzOffset(iana) {
  for (var i = 0; i < TIMEZONES.length; i++) {
    if (TIMEZONES[i].iana === iana) return TIMEZONES[i].offset;
  }
  return 0;
}

// Use Intl to get a DST-aware time display when possible
function fmtTimeIana(utcDate, iana) {
  try {
    var fmt = new Intl.DateTimeFormat('en-AU', {
      timeZone: iana,
      hour: 'numeric', minute: '2-digit', hour12: true
    });
    return fmt.format(utcDate);
  } catch(e) {
    var offset = getTzOffset(iana);
    var local = new Date(utcDate.getTime() + offset * 3600000);
    return fmtTimeManual(local);
  }
}

function fmtDateIana(utcDate, iana) {
  try {
    var fmt = new Intl.DateTimeFormat('en-AU', {
      timeZone: iana,
      weekday: 'short', day: 'numeric', month: 'short'
    });
    return fmt.format(utcDate);
  } catch(e) {
    var offset = getTzOffset(iana);
    var local = new Date(utcDate.getTime() + offset * 3600000);
    return fmtDateManual(local);
  }
}

function fmtTimeManual(d) {
  var h = d.getUTCHours(), mn = d.getUTCMinutes();
  var ap = h >= 12 ? 'PM' : 'AM';
  return (h % 12 || 12) + ':' + pad(mn) + ' ' + ap;
}
function fmtDateManual(d) {
  var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + months[d.getUTCMonth()];
}

function getUTC(m) {
  var d = new Date(m.date + 'T00:00:00Z');
  d.setUTCHours(m.etH + 4, m.etM, 0, 0);
  return d;
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function icsFmt(d) { return d.toISOString().replace(/[-:.]/g,'').slice(0,15) + 'Z'; }

function gcalUrl(m) {
  var start = getUTC(m);
  var end = new Date(start.getTime() + 7200000);
  var title = encodeURIComponent('⚽ WC2026: ' + m.teams);
  var loc = encodeURIComponent(m.venue);
  var det = encodeURIComponent('FIFA World Cup 2026 — ' + m.stage + (m.group ? ' Group ' + m.group : '') + (m.match ? ' Match ' + m.match : ''));
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + title +
    '&dates=' + icsFmt(start) + '/' + icsFmt(end) + '&location=' + loc + '&details=' + det;
}

function buildICS() {
  var lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FIFA World Cup 2026//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:FIFA World Cup 2026'];
  MATCHES.forEach(function(m, i) {
    var s = getUTC(m);
    var e = new Date(s.getTime() + 7200000);
    lines.push('BEGIN:VEVENT','UID:wc2026-' + i + '@calendar','DTSTART:' + icsFmt(s),'DTEND:' + icsFmt(e),
      'SUMMARY:⚽ WC2026: ' + m.teams,'LOCATION:' + m.venue,'DESCRIPTION:' + m.stage + (m.group ? ' Group ' + m.group : ''),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Kicks off in 1 hour','TRIGGER:-PT60M','END:VALARM','END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function download() {
  var blob = new Blob([buildICS()], {type:'text/calendar'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'FIFA_World_Cup_2026.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderList() {
  var matches = state.stage === 'All' ? MATCHES : MATCHES.filter(function(m){ return m.stage === state.stage; });
  var groups = {};
  var order = [];
  matches.forEach(function(m) {
    var utc = getUTC(m);
    var key = fmtDateIana(utc, state.tzIana);
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push({ m: m, utc: utc });
  });

  var html = '';
  order.forEach(function(key) {
    html += '<div class="daygroup"><div class="daylabel">' + esc(key) + '</div>';
    groups[key].forEach(function(item) {
      var m = item.m;
      var col = STAGE_COLOR[m.stage] || '#94a3b8';
      var badge = m.group ? '<span class="badge-g">Grp ' + esc(m.group) + '</span>'
        : (m.match ? '<span class="badge-m">M' + esc(m.match) + '</span>' : '');
      var timeStr = fmtTimeIana(item.utc, state.tzIana);
      html += '<div class="card">' +
        '<div class="dot" style="background:' + col + '"></div>' +
        '<div class="info"><div class="teams">' + esc(m.teams) + '</div>' +
        '<div class="meta"><span class="time">' + esc(timeStr) + '</span><span>·</span><span>' + esc(m.venue) + '</span>' + badge + '</div></div>' +
        '<a class="gcal" href="' + gcalUrl(m) + '" target="_blank" rel="noopener noreferrer">+ GCal</a>' +
        '</div>';
    });
    html += '</div>';
  });
  document.getElementById('list').innerHTML = html;
}

function renderFilters() {
  var c = document.getElementById('filters');
  c.innerHTML = '';
  STAGES.forEach(function(s) {
    var b = document.createElement('button');
    b.textContent = s;
    if (state.stage === s) {
      b.style.background = STAGE_COLOR[s] || '#f0b429';
      b.style.color = '#000';
    }
    b.onclick = function() { state.stage = s; renderFilters(); renderList(); };
    c.appendChild(b);
  });
}

function showSaved() {
  var el = document.getElementById('savedLabel');
  el.style.display = 'inline';
  setTimeout(function() { el.style.display = 'none'; }, 2000);
}

function init() {
  var sel = document.getElementById('tzSelect');
  TIMEZONES.forEach(function(t) {
    var o = document.createElement('option');
    o.value = t.iana;
    o.textContent = t.label;
    if (t.iana === state.tzIana) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = function() {
    state.tzIana = sel.value;
    saveTz(sel.value);
    showSaved();
    renderList();
  };
  document.getElementById('dlBtn').onclick = download;
  renderFilters();
  renderList();
}
init();
</script>
